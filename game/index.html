<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble &amp; Go — Turkey's Great Thanksgiving Escape</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2b1a12;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"
    aria-label="Gobble and Go: a turkey runs from the farmer, jumping fences, hay bales, ovens and falling carving knives, collecting corn"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
